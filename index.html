<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>arn4v</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        @media (pointer: fine) {
            * {
                cursor: none;
            }
        }

        body, html {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #050208;
            color: #ffffff;
        }

        /* Falling Snow Canvas */
        #snowCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            pointer-events: none;
            z-index: 5;
        }

        /* Custom Pink Cursor Canvas */
        #cursorCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            pointer-events: none;
            z-index: 99999;
        }

        /* Click to Enter Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: rgba(5, 2, 8, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            z-index: 9999;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s ease;
        }

        .overlay-title {
            font-family: 'Fira Code', monospace;
            font-size: 1.3rem;
            color: #ff007f;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(255, 0, 127, 0.8);
        }

        .overlay p {
            font-size: 0.95rem;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 300;
            animation: pulseText 2s infinite ease-in-out;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.3; transform: scale(0.97); }
            50% { opacity: 1; transform: scale(1.03); }
        }

        .overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Fullscreen Video Background */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            z-index: 1;
            overflow: hidden;
            background: #000;
        }

        .bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: brightness(0.55) contrast(1.2) saturate(1.2);
        }

        /* Top Controls Layout */
        .top-left-controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-right-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .icon-btn {
            background: rgba(20, 8, 25, 0.65);
            border: 1px solid rgba(255, 0, 127, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: white;
            height: 42px;
            padding: 0 16px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6), inset 0 0 10px rgba(255, 0, 127, 0.15);
        }

        .icon-btn-square {
            width: 42px;
            padding: 0;
        }

        .icon-btn:hover, .icon-btn:active {
            background: rgba(255, 0, 127, 0.3);
            border-color: rgba(255, 0, 127, 0.8);
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.6);
        }

        /* Volume Control Wrap */
        .volume-control-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(20, 8, 25, 0.65);
            border: 1px solid rgba(255, 0, 127, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            height: 42px;
            padding: 0 12px;
            border-radius: 12px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 65px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.25);
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff007f;
            box-shadow: 0 0 10px #ff007f;
        }

        /* Bottom-Left View Counter */
        .view-counter {
            position: fixed;
            bottom: 25px;
            left: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(20, 8, 25, 0.65);
            border: 1px solid rgba(255, 0, 127, 0.3);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 8px 16px;
            border-radius: 12px;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        /* Main Profile Content Wrapper */
        .main-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 20px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .main-wrapper.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Pink Cyber Aura Profile Avatar Effects */
        .avatar-wrap {
            position: relative;
            width: 130px;
            height: 130px;
            margin-bottom: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pink-aura-outer {
            position: absolute;
            top: -14px; left: -14px; right: -14px; bottom: -14px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff007f, #ff00c8, #9900ff, #ff007f);
            animation: spinAura 6s linear infinite, pinkPulse 2s ease-in-out infinite alternate;
            filter: blur(10px);
            opacity: 0.85;
        }

        .pink-aura-ring {
            position: absolute;
            top: -6px; left: -6px; right: -6px; bottom: -6px;
            border-radius: 50%;
            border: 2px dashed #ff007f;
            animation: spinCounter 10s linear infinite;
            filter: drop-shadow(0 0 8px #ff007f);
        }

        @keyframes spinAura { 100% { transform: rotate(360deg); } }
        @keyframes spinCounter { 100% { transform: rotate(-360deg); } }
        @keyframes pinkPulse {
            0% { filter: blur(8px) brightness(1); opacity: 0.75; }
            100% { filter: blur(16px) brightness(1.8); opacity: 1; }
        }

        .avatar {
            position: relative;
            width: 106px;
            height: 106px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.95);
            z-index: 2;
            box-shadow: 0 0 35px rgba(255, 0, 127, 0.8);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .avatar-wrap:hover .avatar {
            transform: scale(1.08) rotate(3deg);
        }

        /* Floating Thought Bubble Badge */
        .pfp-status-bubble {
            position: absolute;
            top: -22px;
            right: -25px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 0.78rem;
            font-weight: 700;
            color: #111111;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5), 0 0 14px rgba(255, 255, 255, 0.7);
            animation: floatBubbleAbove 3s ease-in-out infinite alternate;
            text-align: center;
            white-space: nowrap;
        }

        .pfp-status-bubble::before {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 16px;
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 1);
            border-right: 1px solid rgba(255, 255, 255, 1);
            transform: rotate(45deg);
        }

        @keyframes floatBubbleAbove {
            0% { transform: translateY(0); }
            100% { transform: translateY(-6px); }
        }

        .dev-tag {
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 127, 0.3);
            border: 1px solid #ff007f;
            backdrop-filter: blur(10px);
            padding: 2px 12px;
            border-radius: 12px;
            font-family: 'Fira Code', monospace;
            font-size: 0.65rem;
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 1.5px;
            z-index: 3;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.8);
        }

        /* Username & Verified Badge */
        .username-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            justify-content: center;
        }

        .username {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-shadow: 0 0 20px rgba(255, 0, 127, 0.8);
            background: linear-gradient(135deg, #ffffff 30%, #ff2a8d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .verified-badge {
            color: #ff007f;
            font-size: 1.25rem;
            filter: drop-shadow(0 0 12px rgba(255, 0, 127, 0.9));
        }

        /* Bio & Location */
        .bio {
            font-size: 0.88rem;
            color: rgba(255, 255, 255, 0.95);
            line-height: 1.45;
            max-width: 400px;
            margin-bottom: 6px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
        }

        .location {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
        }

        /* Discord Pill Widget */
        .discord-card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(20, 8, 25, 0.6);
            border: 1px solid rgba(255, 0, 127, 0.35);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 10px 20px 10px 12px;
            border-radius: 22px;
            text-decoration: none;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            margin-bottom: 16px;
        }

        .discord-card:hover {
            background: rgba(255, 0, 127, 0.25);
            border-color: rgba(255, 0, 127, 0.7);
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 16px 45px rgba(255, 0, 127, 0.4);
        }

        .discord-avatar-wrap {
            position: relative;
            width: 42px;
            height: 42px;
        }

        .discord-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .status-dot {
            position: absolute;
            bottom: -1px;
            right: -1px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid #080808;
            background-color: #23a55a;
            box-shadow: 0 0 8px rgba(35, 165, 90, 0.8);
        }

        .status-online { background-color: #23a55a; }
        .status-idle { background-color: #f0b232; }
        .status-dnd { background-color: #f23f43; }
        .status-offline { background-color: #747f8d; }

        .discord-text { text-align: left; }
        .discord-username { font-size: 0.88rem; font-weight: 600; color: #ffffff; }
        .discord-status { font-size: 0.74rem; color: rgba(255, 255, 255, 0.75); }

        /* Interactive Music Player Card with pora.png Artwork */
        .music-player-card {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(20, 8, 25, 0.65);
            border: 1px solid rgba(255, 0, 127, 0.35);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 12px 18px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
        }

        .music-artwork-box {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 0, 127, 0.5);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
            flex-shrink: 0;
        }

        .music-artwork {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .music-info {
            flex: 1;
            text-align: left;
        }

        .song-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        /* Pink Progress Track */
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            position: relative;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: #ff007f;
            border-radius: 3px;
            box-shadow: 0 0 10px #ff007f;
            position: relative;
        }

        /* Rotating Red Heart Handle */
        .heart-handle {
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            line-height: 1;
            animation: rotateHeart 2.5s linear infinite;
            filter: drop-shadow(0 0 6px #ff0055);
            pointer-events: none;
        }

        @keyframes rotateHeart {
            0% { transform: translateY(-50%) rotate(0deg); }
            100% { transform: translateY(-50%) rotate(360deg); }
        }

        .time-display {
            font-family: 'Fira Code', monospace;
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: space-between;
        }

        .music-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.95rem;
        }

        .music-controls i {
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }

        .music-controls i:hover {
            color: #ff007f;
            transform: scale(1.15);
        }
    </style>
</head>
<body>

    <!-- Falling Snow Canvas -->
    <canvas id="snowCanvas"></canvas>

    <!-- Canvas Pink Cursor -->
    <canvas id="cursorCanvas"></canvas>

    <!-- Click-to-Enter Overlay -->
    <div id="overlay" class="overlay">
        <div class="overlay-title">&lt;ARN4V.DEV /&gt;</div>
        <p>[ click anywhere to enter ]</p>
    </div>

    <!-- Top Left Controls -->
    <div class="top-left-controls">
        <div class="icon-btn icon-btn-square" id="audioToggleBtn" title="Toggle Sound">
            <i class="fa-solid fa-volume-xmark" id="audioIcon"></i>
        </div>

        <div class="volume-control-wrap">
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
        </div>
    </div>

    <!-- Top Right Portfolio Button -->
    <div class="top-right-controls">
        <a href="https://arnavjalwekar4-code.github.io/about-me/" target="_blank" class="icon-btn">
            <i class="fa-solid fa-code"></i>
            <span>Portfolio</span>
        </a>
    </div>

    <!-- Bottom Left View Counter -->
    <div class="view-counter">
        <i class="fa-solid fa-eye"></i>
        <span id="visitCount">12</span>
    </div>

    <!-- Fullscreen Video Background -->
    <div class="bg-container">
        <video id="bgVideo" autoplay muted loop playsinline class="bg-video">
            <source src="baground.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Main Profile Content Container -->
    <div class="main-wrapper" id="mainWrapper">
        
        <!-- Pink Aura Profile Avatar -->
        <div class="avatar-wrap">
            <div class="pink-aura-outer"></div>
            <div class="pink-aura-ring"></div>
            <img src="logo.png" id="mainPfp" alt="Arnav Profile" class="avatar">
            
            <!-- Dev Tag -->
            <div class="dev-tag">DEV</div>
            
            <!-- Animated Thought Bubble Status Badge -->
            <div class="pfp-status-bubble">💭 Hello :3</div>
        </div>

        <!-- Username & Verified Badge -->
        <div class="username-container">
            <h1 class="username">Arnav</h1>
            <i class="fa-solid fa-circle-check verified-badge" title="Verified Developer"></i>
        </div>

        <p class="bio" id="userBio">just a dev with big dreams ♡ no ego, just code & kindness ☁️</p>

        <div class="location">
            <i class="fa-solid fa-location-dot" style="font-size: 0.75rem; color: #ff007f;"></i> los angeles vally
        </div>

        <!-- Discord Card Widget -->
        <a href="https://discord.com/users/1540399501142134847" target="_blank" class="discord-card">
            <div class="discord-avatar-wrap">
                <img src="logo.png" id="discordPfp" alt="Discord Avatar" class="discord-avatar">
                <div class="status-dot status-online" id="discordStatusDot"></div>
            </div>
            <div class="discord-text">
                <div class="discord-username" id="discordTag">arn4v_dev</div>
                <div class="discord-status" id="discordCustomStatus">Online</div>
            </div>
        </a>

        <!-- Interactive Music Player Card with pora.png Artwork -->
        <div class="music-player-card">
            <div class="music-artwork-box">
                <img src="pora.png" alt="Song Artwork" class="music-artwork">
            </div>
            <div class="music-info">
                <div class="song-title">Whine in Brazil</div>
                <div class="progress-bar-container" id="progressBarContainer">
                    <div class="progress-bar-fill" id="progressBarFill">
                        <!-- Rotating Red Heart Handle -->
                        <div class="heart-handle">❤️</div>
                    </div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="durationTime">2:55</span>
                </div>
            </div>
            <div class="music-controls">
                <i class="fa-solid fa-backward-step"></i>
                <i class="fa-solid fa-play" id="cardPlayBtn"></i>
                <i class="fa-solid fa-forward-step"></i>
            </div>
        </div>

    </div>

    <!-- Audio Element (Using holy.mp3) -->
    <audio id="bgSong" loop preload="auto" playsinline>
        <source src="holy.mp3" type="audio/mpeg">
    </audio>

    <script>
        const DISCORD_USER_ID = "1540399501142134847";

        document.addEventListener("DOMContentLoaded", () => {
            const overlay = document.getElementById("overlay");
            const bgSong = document.getElementById("bgSong");
            const bgVideo = document.getElementById("bgVideo");
            const audioToggleBtn = document.getElementById("audioToggleBtn");
            const audioIcon = document.getElementById("audioIcon");
            const cardPlayBtn = document.getElementById("cardPlayBtn");
            const volumeSlider = document.getElementById("volumeSlider");
            const mainWrapper = document.getElementById("mainWrapper");
            const progressBarFill = document.getElementById("progressBarFill");
            const progressBarContainer = document.getElementById("progressBarContainer");
            const currentTimeEl = document.getElementById("currentTime");
            const durationTimeEl = document.getElementById("durationTime");

            let isPlaying = false;
            let wasPlayingBeforeTabSwitch = false;
            let siteEntered = false;
            bgSong.volume = 0.5;

            const playVideo = () => {
                if (bgVideo) bgVideo.play().catch(() => {});
            };
            playVideo();

            const enterSite = () => {
                if (siteEntered) return;
                siteEntered = true;

                overlay.classList.add("hidden");
                mainWrapper.classList.add("visible");
                playVideo();

                bgSong.play().then(() => {
                    isPlaying = true;
                    updateAudioUI(true);
                }).catch(err => console.log("Audio unlock error:", err));
            };

            overlay.addEventListener("click", enterSite);
            overlay.addEventListener("touchstart", enterSite, { passive: true });

            const toggleAudio = (e) => {
                if (e) e.stopPropagation();
                if (isPlaying) {
                    bgSong.pause();
                    isPlaying = false;
                    updateAudioUI(false);
                } else {
                    bgSong.play().then(() => {
                        isPlaying = true;
                        updateAudioUI(true);
                    }).catch(() => {});
                }
            };

            audioToggleBtn.addEventListener("click", toggleAudio);
            cardPlayBtn.addEventListener("click", toggleAudio);

            volumeSlider.addEventListener("input", (e) => {
                const vol = parseFloat(e.target.value);
                bgSong.volume = vol;
                if (vol === 0) {
                    audioIcon.className = "fa-solid fa-volume-xmark";
                } else if (isPlaying) {
                    audioIcon.className = "fa-solid fa-volume-high";
                }
            });

            // Music Player Time & Progress Bar Updater
            bgSong.addEventListener("timeupdate", () => {
                if (bgSong.duration) {
                    const progressPercent = (bgSong.currentTime / bgSong.duration) * 100;
                    progressBarFill.style.width = `${progressPercent}%`;
                    currentTimeEl.textContent = formatTime(bgSong.currentTime);
                    durationTimeEl.textContent = formatTime(bgSong.duration);
                }
            });

            progressBarContainer.addEventListener("click", (e) => {
                const rect = progressBarContainer.getBoundingClientRect();
                const clickPosition = (e.clientX - rect.left) / rect.width;
                if (bgSong.duration) {
                    bgSong.currentTime = clickPosition * bgSong.duration;
                }
            });

            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }

            // Auto-pause when leaving tab & auto-resume when returning
            document.addEventListener("visibilitychange", () => {
                if (document.hidden) {
                    if (isPlaying) {
                        wasPlayingBeforeTabSwitch = true;
                        bgSong.pause();
                        isPlaying = false;
                        updateAudioUI(false);
                    }
                } else {
                    if (wasPlayingBeforeTabSwitch) {
                        bgSong.play().then(() => {
                            isPlaying = true;
                            updateAudioUI(true);
                        }).catch(() => {});
                        wasPlayingBeforeTabSwitch = false;
                    }
                }
            });

            function updateAudioUI(active) {
                if (active) {
                    audioIcon.className = "fa-solid fa-volume-high";
                    cardPlayBtn.className = "fa-solid fa-pause";
                } else {
                    audioIcon.className = "fa-solid fa-volume-xmark";
                    cardPlayBtn.className = "fa-solid fa-play";
                }
            }

            updateVisitorCounter();
            fetchDiscordPresence();
            setInterval(fetchDiscordPresence, 8000);

            initSnowEffect();

            if (window.matchMedia("(pointer: fine)").matches) {
                initCursorEffect();
            }
        });

        function updateVisitorCounter() {
            let count = localStorage.getItem("site_page_views");
            if (!count) {
                count = 12;
            } else {
                count = parseInt(count) + 1;
            }
            localStorage.setItem("site_page_views", count);
            document.getElementById("visitCount").textContent = count.toLocaleString();
        }

        async function fetchDiscordPresence() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`);
                const resData = await response.json();

                if (!resData.success) return;

                const data = resData.data;

                if (data.discord_user.username) {
                    document.getElementById("discordTag").textContent = data.discord_user.username;
                }

                if (data.discord_user.avatar) {
                    const avatarUrl = `https://cdn.discordapp.com/avatars/${DISCORD_USER_ID}/${data.discord_user.avatar}.png?size=256`;
                    document.getElementById("discordPfp").src = avatarUrl;
                    document.getElementById("mainPfp").src = avatarUrl;
                }

                const statusDot = document.getElementById("discordStatusDot");
                statusDot.className = "status-dot status-" + (data.discord_status || "online");

                const statusText = document.getElementById("discordCustomStatus");
                if (data.custom_status && data.custom_status.state) {
                    statusText.textContent = data.custom_status.state;
                } else if (data.activities && data.activities.length > 0) {
                    const act = data.activities.find(a => a.type !== 4);
                    if (act) {
                        statusText.textContent = `Playing ${act.name}`;
                    } else {
                        statusText.textContent = data.discord_status || "Online";
                    }
                } else {
                    statusText.textContent = data.discord_status === "offline" ? "Offline" : "Online";
                }

            } catch (error) {
                console.log("Lanyard sync notice");
            }
        }

        function initSnowEffect() {
            const canvas = document.getElementById("snowCanvas");
            const ctx = canvas.getContext("2d");

            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener("resize", () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const numFlakes = 45;
            const flakes = [];

            for (let i = 0; i < numFlakes; i++) {
                flakes.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 2.5 + 1,
                    d: Math.random() * 1 + 0.5,
                    opacity: Math.random() * 0.7 + 0.3
                });
            }

            function drawFlakes() {
                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = "rgba(255, 255, 255, 0.8)";

                for (let i = 0; i < numFlakes; i++) {
                    const f = flakes[i];
                    ctx.globalAlpha = f.opacity;
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
                    ctx.fill();

                    f.y += f.d;
                    f.x += Math.sin(f.y * 0.02) * 0.5;

                    if (f.y > height) {
                        flakes[i] = { x: Math.random() * width, y: 0, r: f.r, d: f.d, opacity: f.opacity };
                    }
                }
                requestAnimationFrame(drawFlakes);
            }
            drawFlakes();
        }

        function initCursorEffect() {
            const canvas = document.getElementById("cursorCanvas");
            const ctx = canvas.getContext("2d");

            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener("resize", () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            });

            const particles = [];
            const mouse = { x: width / 2, y: height / 2 };

            window.addEventListener("mousemove", (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;

                for (let i = 0; i < 2; i++) {
                    particles.push(new Particle(mouse.x, mouse.y));
                }
            });

            class Particle {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                    this.size = Math.random() * 2.5 + 1;
                    this.speedX = (Math.random() - 0.5) * 1.5;
                    this.speedY = (Math.random() - 0.5) * 1.5;
                    this.life = 1;
                    this.decay = Math.random() * 0.02 + 0.015;
                    this.color = `#ff007f`;
                }

                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.life -= this.decay;
                }

                draw() {
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = Math.max(0, this.life);
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);

                ctx.globalAlpha = 0.85;
                ctx.strokeStyle = "rgba(255, 0, 127, 0.9)";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 9, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 2.5, 0, Math.PI * 2);
                ctx.fill();

                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw();

                    if (particles[i].life <= 0) {
                        particles.splice(i, 1);
                    }
                }

                requestAnimationFrame(animate);
            }

            animate();
        }
    </script>
</body>
